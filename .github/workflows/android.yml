name: Build Arcanum for Android with sse2neon

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Inject sxe2neon and Patch Makefile
        run: |
          # 1. Download sse2neon header to bridge Intel intrinsics to ARM NEON
          curl -sL https://raw.githubusercontent.com/DLTcollab/sse2neon/master/sse2neon.h -o src/sse2neon.h

          # 2. Find the Makefile
          MAKEFILE_PATH=$(find . -iname "makefile" | head -n 1)
          MAKE_DIR=$(dirname "$MAKEFILE_PATH")

          # 3. Clean x86 flags and -Werror
          sed -i 's/-mavx2//g' "$MAKEFILE_PATH"
          sed -i 's/-mfma//g' "$MAKEFILE_PATH"
          sed -i 's/-mbmi2//g' "$MAKEFILE_PATH"
          sed -i 's/-mbmi//g' "$MAKEFILE_PATH"
          sed -i 's/-mpopcnt//g' "$MAKEFILE_PATH"
          sed -i 's/-mlzcnt//g' "$MAKEFILE_PATH"
          sed -i 's/-march=native//g' "$MAKEFILE_PATH"
          sed -i 's/-Werror//g' "$MAKEFILE_PATH"

          # 4. Inject static linking, ARM Neon SIMD, and force inclusion of sse2neon where immintrin.h is used
          sed -i 's/override CFLAGS += /override CFLAGS += -march=armv8-a+simd -static-libstdc++ -include sse2neon.h -Wno-error -Wno-unused-parameter -Wno-sign-compare /g' "$MAKEFILE_PATH"

          # 5. Set up Android NDK Clang compiler path for ARM64 (API 28)
          TOOLCHAIN="${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64"
          export CXX="$TOOLCHAIN/bin/aarch64-linux-android28-clang++"
          export CC="$TOOLCHAIN/bin/aarch64-linux-android28-clang"

          # 6. Build Arcanum
          cd "$MAKE_DIR"
          make CXX="$CXX" CC="$CC"

          # 7. Locate and bundle binary
          mkdir -p "${{ github.workspace }}/artifact"
          if [ -f "build/Arcanum" ]; then
            cp build/Arcanum "${{ github.workspace }}/artifact/arcanum"
          elif [ -f "Arcanum" ]; then
            cp Arcanum "${{ github.workspace }}/artifact/arcanum"
          else
            find . -maxdepth 2 -type f -executable -not -name "*.sh" -not -name "*.h" -not -name "*.cpp" -not -name "*.o" -exec cp {} "${{ github.workspace }}/artifact/arcanum" \;
          fi

      - name: Verify Binary Architecture
        run: |
          file "${{ github.workspace }}/artifact/arcanum"
          ls -la "${{ github.workspace }}/artifact"

      - name: Upload Compiled Binary
        uses: actions/upload-artifact@v4
        with:
          name: arcanum-android-arm64
          path: artifact/arcanum
