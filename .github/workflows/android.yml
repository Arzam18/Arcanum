name: Build Arcanum for Android ARM64

on:
  workflow_dispatch:
  push:
    branches: ['*']
  pull_request:
    branches: ['*']

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Verify embedded network DotProd compatibility
        run: python3 scripts/verify_dotprod_network.py arcanum-net-v7.0.fnnue

      - name: Build Android ARM64 NEON (baseline)
        shell: bash
        run: |
          set -euo pipefail
          TOOLCHAIN="${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64"
          CXX="$TOOLCHAIN/bin/aarch64-linux-android24-clang++"
          SOURCES=$(find src -type f -name '*.cpp' ! -path 'src/tests/*' ! -path 'src/tuning/*' ! -name 'argsparser.cpp' | sort)
          SOURCES="$SOURCES src/tuning/nnueformat.cpp"
          mkdir -p dist/bin

          "$CXX" $SOURCES \
            -O3 -DNDEBUG -std=c++17 -pthread \
            -march=armv8-a+simd -mtune=cortex-a76 \
            -DANDROID_UCI_ONLY -DUSE_NEON \
            -DDEFAULT_NNUE=arcanum-net-v7.0.fnnue -DENABLE_INCBIN \
            -DLOG_FILE_NAME=Arcanum -DDISABLE_DEBUG \
            -Wno-return-type -Wno-unused-parameter \
            -Isrc -Isrc/history -Isrc/syzygy -Isrc/uci -Isrc/tuning -I. \
            -static-libstdc++ -lm \
            -o dist/bin/arcanum-neon

          file dist/bin/arcanum-neon
          "$TOOLCHAIN/bin/llvm-readelf" -h dist/bin/arcanum-neon

      - name: Verify NEON binary
        shell: bash
        run: |
          TOOLCHAIN="${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64"
          export PATH="$TOOLCHAIN/bin:$PATH"
          python3 scripts/verify_android_arm64.py dist/bin/arcanum-neon neon

      - name: Build Android ARM64 NEON + DotProd
        shell: bash
        run: |
          set -euo pipefail
          TOOLCHAIN="${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64"
          CXX="$TOOLCHAIN/bin/aarch64-linux-android24-clang++"
          SOURCES=$(find src -type f -name '*.cpp' ! -path 'src/tests/*' ! -path 'src/tuning/*' ! -name 'argsparser.cpp' | sort)
          SOURCES="$SOURCES src/tuning/nnueformat.cpp"

          "$CXX" $SOURCES \
            -O3 -DNDEBUG -std=c++17 -pthread \
            -march=armv8.2-a+dotprod -mtune=cortex-a76 \
            -DANDROID_UCI_ONLY -DUSE_NEON -DUSE_DOTPROD \
            -DDEFAULT_NNUE=arcanum-net-v7.0.fnnue -DENABLE_INCBIN \
            -DLOG_FILE_NAME=Arcanum -DDISABLE_DEBUG \
            -Wno-return-type -Wno-unused-parameter \
            -Isrc -Isrc/history -Isrc/syzygy -Isrc/uci -Isrc/tuning -I. \
            -static-libstdc++ -lm \
            -o dist/bin/arcanum-dotprod

          file dist/bin/arcanum-dotprod
          "$TOOLCHAIN/bin/llvm-readelf" -h dist/bin/arcanum-dotprod

      - name: Verify DotProd binary
        shell: bash
        run: |
          TOOLCHAIN="${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64"
          export PATH="$TOOLCHAIN/bin:$PATH"
          python3 scripts/verify_android_arm64.py dist/bin/arcanum-dotprod dotprod

      - name: Verify embedded NNUE and engine-only artifacts
        shell: bash
        run: |
          set -euo pipefail
          NET_SIZE=$(stat -c%s arcanum-net-v7.0.fnnue)
          for binary in dist/bin/arcanum-neon dist/bin/arcanum-dotprod; do
            BIN_SIZE=$(stat -c%s "$binary")
            if (( BIN_SIZE <= NET_SIZE )); then
              echo "${binary} does not appear to contain the embedded NNUE network." >&2
              exit 1
            fi
            echo "PASS: ${binary} includes an embedded network (${BIN_SIZE} bytes; network ${NET_SIZE} bytes)."
          done
          test "$(find dist/bin -maxdepth 1 -type f | wc -l)" -eq 2

      - name: Upload Android ARM64 binaries
        uses: actions/upload-artifact@v4
        with:
          name: arcanum-android-arm64
          path: dist/bin/*
          if-no-files-found: error
