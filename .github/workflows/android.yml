name: Build Arcanum for Android ARM64

on:
  workflow_dispatch:
    inputs:
      uci_date:
        description: 'Optional UCI version override (YYYYMMDD). Leave blank to use Arcanum 2.8.'
        required: false
        default: ''
        type: string
  push:
    branches: ['*']
  pull_request:
    branches: ['*']

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Resolve UCI version
        shell: bash
        env:
          UCI_DATE: ${{ inputs.uci_date }}
        run: |
          if [[ -z "${UCI_DATE//[[:space:]]/}" ]]; then
            ENGINE_VERSION="2.8"
            echo "Blank uci_date: preserving Arcanum's official engine version ${ENGINE_VERSION}."
          else
            if [[ ! "$UCI_DATE" =~ ^[0-9]{8}$ ]]; then
              echo "uci_date must be blank or exactly 8 digits in YYYYMMDD format." >&2
              exit 1
            fi
            # The date replaces the UCI version field; it is not appended to 2.8.
            ENGINE_VERSION="$UCI_DATE"
            echo "UCI version override: ${ENGINE_VERSION}"
          fi
          echo "ARCANUM_VERSION=${ENGINE_VERSION}" >> "$GITHUB_ENV"

      - name: Verify embedded network DotProd compatibility
        run: python3 scripts/verify_dotprod_network.py arcanum-net-v7.0.fnnue

      - name: Build Android ARM64 NEON (baseline)
        shell: bash
        run: |
          set -euo pipefail
          TOOLCHAIN="${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64"
          CXX="$TOOLCHAIN/bin/aarch64-linux-android24-clang++"
          SOURCES=$(find src -type f -name '*.cpp' ! -path 'src/tests/*' ! -path 'src/tuning/*' ! -name 'argsparser.cpp' | sort)
          SOURCES="$SOURCES src/tuning/nnueformat.cpp"
          mkdir -p dist/bin

          "$CXX" $SOURCES \
            -O3 -DNDEBUG -std=c++17 -pthread \
            -march=armv8-a+simd -mtune=cortex-a76 \
            -DANDROID_UCI_ONLY -DUSE_NEON -DARCANUM_VERSION=${ARCANUM_VERSION} \
            -DDEFAULT_NNUE=arcanum-net-v7.0.fnnue -DENABLE_INCBIN \
            -DLOG_FILE_NAME=Arcanum -DDISABLE_DEBUG \
            -Wno-return-type -Wno-unused-parameter \
            -Isrc -Isrc/history -Isrc/syzygy -Isrc/uci -Isrc/tuning -I. \
            -static-libstdc++ -lm \
            -o dist/bin/arcanum-neon

          file dist/bin/arcanum-neon
          "$TOOLCHAIN/bin/llvm-readelf" -h dist/bin/arcanum-neon

      - name: Verify NEON binary
        shell: bash
        run: |
          TOOLCHAIN="${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64"
          export PATH="$TOOLCHAIN/bin:$PATH"
          python3 scripts/verify_android_arm64.py dist/bin/arcanum-neon neon

      - name: Build Android ARM64 NEON + DotProd
        shell: bash
        run: |
          set -euo pipefail
          TOOLCHAIN="${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64"
          CXX="$TOOLCHAIN/bin/aarch64-linux-android24-clang++"
          SOURCES=$(find src -type f -name '*.cpp' ! -path 'src/tests/*' ! -path 'src/tuning/*' ! -name 'argsparser.cpp' | sort)
          SOURCES="$SOURCES src/tuning/nnueformat.cpp"

          "$CXX" $SOURCES \
            -O3 -DNDEBUG -std=c++17 -pthread \
            -march=armv8.2-a+dotprod -mtune=cortex-a76 \
            -DANDROID_UCI_ONLY -DUSE_NEON -DUSE_DOTPROD -DARCANUM_VERSION=${ARCANUM_VERSION} \
            -DDEFAULT_NNUE=arcanum-net-v7.0.fnnue -DENABLE_INCBIN \
            -DLOG_FILE_NAME=Arcanum -DDISABLE_DEBUG \
            -Wno-return-type -Wno-unused-parameter \
            -Isrc -Isrc/history -Isrc/syzygy -Isrc/uci -Isrc/tuning -I. \
            -static-libstdc++ -lm \
            -o dist/bin/arcanum-dotprod

          file dist/bin/arcanum-dotprod
          "$TOOLCHAIN/bin/llvm-readelf" -h dist/bin/arcanum-dotprod

      - name: Verify DotProd binary
        shell: bash
        run: |
          TOOLCHAIN="${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64"
          export PATH="$TOOLCHAIN/bin:$PATH"
          python3 scripts/verify_android_arm64.py dist/bin/arcanum-dotprod dotprod

      - name: Verify embedded NNUE and engine-only artifacts
        shell: bash
        run: |
          set -euo pipefail
          NET_SIZE=$(stat -c%s arcanum-net-v7.0.fnnue)
          for binary in dist/bin/arcanum-neon dist/bin/arcanum-dotprod; do
            BIN_SIZE=$(stat -c%s "$binary")
            if (( BIN_SIZE <= NET_SIZE )); then
              echo "${binary} does not appear to contain the embedded NNUE network." >&2
              exit 1
            fi
            echo "PASS: ${binary} includes an embedded network (${BIN_SIZE} bytes; network ${NET_SIZE} bytes)."
          done
          test "$(find dist/bin -maxdepth 1 -type f | wc -l)" -eq 2

      - name: Verify UCI version override
        shell: bash
        run: |
          set -euo pipefail
          echo "Built UCI version: ${ARCANUM_VERSION}"
          for binary in dist/bin/arcanum-neon dist/bin/arcanum-dotprod; do
            # Clang/LLD may keep the prefix and version as separate strings,
            # while other optimization/linker combinations merge them.
            BIN_STRINGS=$(strings -a "$binary")
            if grep -Fqx "id name Arcanum ${ARCANUM_VERSION}" <<< "$BIN_STRINGS"; then
              :
            elif grep -Fqx "id name Arcanum " <<< "$BIN_STRINGS" && \
                 grep -Fq "$ARCANUM_VERSION" <<< "$BIN_STRINGS"; then
              :
            else
              echo "ERROR: ${binary} does not contain the expected UCI name/version: Arcanum ${ARCANUM_VERSION}" >&2
              exit 1
            fi
            echo "PASS: $binary contains UCI identity Arcanum ${ARCANUM_VERSION}."
          done

      - name: Upload Android ARM64 binaries
        uses: actions/upload-artifact@v4
        with:
          name: arcanum-android-arm64
          path: dist/bin/*
          if-no-files-found: error
